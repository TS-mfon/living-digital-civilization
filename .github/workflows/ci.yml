name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - name: Compile TypeScript and frontend
        run: pnpm build
      - name: API and simulation tests
        run: pnpm test
      - name: MCP protocol checks
        run: pnpm mcp:test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GenLayer source linter
        run: pip install genvm-linter==0.11.0
      - name: GenLayer source lint
        run: genvm-lint lint contracts/genlayer/institutional_evaluator.py
      - name: Verify CI definition
        run: node scripts/check-ci-workflow.mjs
